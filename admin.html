<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f0ff;
            padding: 30px;
        }

        h1 {
            color: #6c3483;
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            margin-top: 25px;
        }

        th, td {
            padding: 15px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #8e44ad;
            color: white;
        }
    </style>
</head>

<body>

    <h1>Portfolio Admin Dashboard</h1>

    <h2>Contact Messages</h2>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Message</th>
            </tr>
        </thead>

        <tbody id="messages">
        </tbody>
    </table>

</body>
</html>
